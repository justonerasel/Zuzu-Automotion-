name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build, Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Accept required SDK licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER_BIN="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER_BIN" ] && [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER_BIN="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          if [ -n "$SDKMANAGER_BIN" ]; then
            (yes || true) | "$SDKMANAGER_BIN" --licenses >/dev/null
          else
            echo "sdkmanager not found in PATH or $SDK_ROOT/cmdline-tools/latest/bin" >&2
            exit 1
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Provision debug keystore
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Run Android Lint
        run: gradle :app:lintDebug --no-daemon --stacktrace

      - name: Compile Release Kotlin
        run: gradle :app:compileReleaseKotlin --no-daemon --stacktrace

      - name: Assemble Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Run Unit Tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zuzu-social-ai-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
