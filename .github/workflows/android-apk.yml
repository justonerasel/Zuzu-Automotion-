name: Build Zuzu Social AI APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect Android Gradle project and module
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          SETTINGS_FILE=""
          if [ -f "settings.gradle.kts" ]; then
            SETTINGS_FILE="settings.gradle.kts"
          elif [ -f "settings.gradle" ]; then
            SETTINGS_FILE="settings.gradle"
          else
            SETTINGS_FILE="$(find . -maxdepth 3 \( -name "settings.gradle.kts" -o -name "settings.gradle" \) | head -n 1 || true)"
          fi

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::Project configuration failure: Could not locate settings.gradle or settings.gradle.kts."
            exit 1
          fi

          GRADLE_ROOT="$(dirname "$SETTINGS_FILE")"
          echo "gradle_root=$GRADLE_ROOT" >> "$GITHUB_OUTPUT"

          WRAPPER_PROPS="$GRADLE_ROOT/gradle/wrapper/gradle-wrapper.properties"
          GRADLE_VERSION="9.3.1"
          if [ -f "$WRAPPER_PROPS" ]; then
            EXTRACTED_VER="$(grep -E '^distributionUrl=' "$WRAPPER_PROPS" | sed -E 's/.*gradle-([0-9]+(\.[0-9]+)+).*/\1/' | head -n 1 || true)"
            if [ -n "$EXTRACTED_VER" ]; then
              GRADLE_VERSION="$EXTRACTED_VER"
            fi
          fi
          echo "gradle_version=$GRADLE_VERSION" >> "$GITHUB_OUTPUT"

          APP_MODULE=""
          for build_file in "$GRADLE_ROOT"/*/build.gradle.kts "$GRADLE_ROOT"/*/build.gradle; do
            [ -f "$build_file" ] || continue
            if grep -qE 'com\.android\.application|android\.application' "$build_file"; then
              MOD_DIR="$(basename "$(dirname "$build_file")")"
              if grep -qE "[\"']:${MOD_DIR}[\"']" "$SETTINGS_FILE"; then
                APP_MODULE=":${MOD_DIR}"
                break
              fi
            fi
          done

          if [ -z "$APP_MODULE" ]; then
            echo "::error::Project configuration failure: Could not detect an Android application module in $SETTINGS_FILE."
            exit 1
          fi

          echo "app_module=$APP_MODULE" >> "$GITHUB_OUTPUT"
          echo "Detected Gradle root: $GRADLE_ROOT | Module: $APP_MODULE | Gradle: $GRADLE_VERSION"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.detect.outputs.gradle_version }}

      - name: Provision debug keystore if required
        shell: bash
        working-directory: ${{ steps.detect.outputs.gradle_root }}
        run: |
          set -euo pipefail
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "Decoded debug.keystore from debug.keystore.base64"
          fi

      - name: Generate debug keystore if missing
        shell: bash
        working-directory: ${{ steps.detect.outputs.gradle_root }}
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Android Debug APK
        shell: bash
        working-directory: ${{ steps.detect.outputs.gradle_root }}
        run: |
          set -euo pipefail
          APP_MODULE="${{ steps.detect.outputs.app_module }}"
          TASK="${APP_MODULE}:assembleDebug"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "Running Gradle wrapper task: $TASK"
            ./gradlew "$TASK" --no-daemon --stacktrace
          else
            echo "Gradle wrapper script (gradlew) not present; running provisioned Gradle ${{ steps.detect.outputs.gradle_version }} task: $TASK"
            gradle "$TASK" --no-daemon --stacktrace
          fi

          APK_LIST="$(find . -path "*/build/outputs/apk/*" -name "*.apk" -type f)"
          if [ -z "$APK_LIST" ]; then
            echo "::error::APK build completed without producing any .apk files under build/outputs/apk/."
            exit 1
          fi
          echo "Generated APK files:"
          echo "$APK_LIST"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zuzu-Social-AI-APK
          path: "**/build/outputs/apk/**/*.apk"
          retention-days: 14
          if-no-files-found: error
